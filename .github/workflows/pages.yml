# Builds the PWA and publishes it to GitHub Pages on every push to master.
# Pages has to be set to "GitHub Actions" as the source in the repository settings once.
name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [master]
    paths: ['pwa/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push waits for a running deployment rather than cutting it off halfway
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The dictionaries are Git LFS objects, which Pages does not serve on its own. They are
      # cached between the runs by their ids, so that the 25 MB are downloaded only when one changes
      - run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-ids
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
      - run: git lfs pull
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - run: npm ci
        working-directory: pwa
      - run: npm test
        working-directory: pwa
      - run: npm run typecheck
        working-directory: pwa
      - run: npm run build
        working-directory: pwa
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
